# --- НАСТРОЙКИ ДОНГЛА (КРИТИЧНО) ---
# Донгл должен быть центральным устройством
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# --- ДИСПЛЕЙ ST7789 ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_SPI=y

# Настройка цвета (16 бит для ST7789)
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_VDB_SIZE=10

# --- ПАМЯТЬ И СТАБИЛЬНОСТЬ (ОБЯЗАТЕЛЬНО) ---
# Отключаем Studio и ЛОГИ, чтобы влез цветной экран
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_USB_LOGGING=n
CONFIG_USB_CDC_ACM_CONSOLE=n
CONFIG_BT_DEBUG_LOG=n

# Отключаем конфликты с I2C
CONFIG_I2C=n
CONFIG_SSD1306=n
