# Количество периферийных устройств, подключаемых к донглу
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_BAS=y
CONFIG_ZMK_DISPLAY=y
# Включение дисплея

# Включение подсветки через GPIO
CONFIG_ZMK_DISPLAY_BACKLIGHT=y

# Настройки цвета
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y

# Если нужно отображать батарею донгла
CONFIG_ZMK_DONGLE_SCREEN_DONGLE_BATTERY=y