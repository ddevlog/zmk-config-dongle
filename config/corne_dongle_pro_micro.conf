# Количество периферийных устройств, подключаемых к донглу
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Увеличиваем максимальное количество одновременных BLE-подключений
# (2 половинки + 5 профилей для переключения между компьютерами)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# (Опционально) Увеличиваем таймаут ожидания подключения половинок
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERAL_TIMEOUT_MS=30000
