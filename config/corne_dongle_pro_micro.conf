# Количество периферийных устройств, подключаемых к донглу
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_BAS=y
CONFIG_ZMK_DISPLAY=y
# Включение дисплея
CONFIG_SHIELD_DONGLE_DISPLAY=y
CONFIG_ZMK_DONGLE_DISPLAY_ST7789=y
CONFIG_ZMK_DONGLE_DISPLAY_CS_PIN=1.06
CONFIG_ZMK_DONGLE_DISPLAY_DC_PIN=1.04
CONFIG_ZMK_DONGLE_DISPLAY_RST_PIN=0.11
CONFIG_ZMK_DONGLE_DISPLAY_BL_PIN=0.10
CONFIG_ZMK_DONGLE_DISPLAY_SPI_BUS=3
CONFIG_ZMK_DONGLE_DISPLAY_SPI_FREQUENCY=20000000
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y